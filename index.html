<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Profesional | Arfa Danish</title>
    <!-- Google Fonts untuk tampilan premium -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Pengaturan Dasar Tema Gelap Ungu Premium */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: #08060f; /* Hitam keunguan pekat & elegan */
            color: #e2e0e7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Kartu Utama Portofolio */
        .portfolio-card {
            background: #110d1f; /* Ungu gelap solid */
            border: 1px solid #201838;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        /* Avatar Inisial Premium */
        .profile-img {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            color: white;
            font-weight: 700;
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a78bfa;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Kotak Konten Utama */
        .section-box {
            text-align: left;
            background: #17122b;
            border: 1px solid #251d45;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.9rem;
            color: #c084fc;
            margin-bottom: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Tata Letak Biodata (Grid) */
        .bio-grid {
            display: grid;
            grid-template-columns: 80px 12px 1fr;
            row-gap: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .bio-label {
            color: #9ca3af;
            font-weight: 500;
        }

        .bio-colon {
            color: #524775;
        }

        .bio-value {
            color: #e5e7eb;
            font-weight: 500;
            word-break: break-all;
        }

        /* Grid untuk Keahlian & Hobi (2 Kolom) */
        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Membagi menjadi 2 kolom sama besar */
            gap: 12px;
        }

        /* Kotak Item Interaktif (Bisa Dipencet) */
        .interactive-card {
            background: #1f183a;
            border: 1px solid #2f2558;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ddd6fe;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Efek saat Kursor di atas Kotak (Hover) */
        .interactive-card:hover {
            background: #2d2254;
            border-color: #6366f1; /* Mengubah border menjadi biru keunguan cerah */
            color: #ffffff;
            transform: translateY(-3px); /* Efek melayang */
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        /* Efek saat Kotak Diklik (Active) */
        .interactive-card:active {
            transform: translateY(-1px);
            background: #251c47;
        }

        /* Tombol Instagram Premium */
        .instagram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(238, 42, 123, 0.3);
        }

        .instagram-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(238, 42, 123, 0.5);
            letter-spacing: 0.5px;
        }

        .instagram-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <!-- Avatar Inisial -->
        <div class="profile-img">AD</div>
        
        <!-- Identitas Utama -->
        <h1>Arfa Danish</h1>
        <div class="subtitle">Pelajar & Developer</div>

        <!-- Bagian Biodata -->
        <div class="section-box">
            <div class="section-title">🆔 Biodata</div>
            <div class="bio-grid">
                <div class="bio-label">Usia</div>
                <div class="bio-colon">:</div>
                <div class="bio-value">16 Tahun</div>

                <div class="bio-label">Status</div>
                <div class="bio-colon">:</div>
                <div class="bio-value">Pelajar</div>

                <div class="bio-label">Sekolah</div>
                <div class="bio-colon">:</div>
                <div class="bio-value">SMK N 11 Semarang</div>

                <div class="bio-label">Email</div>
                <div class="bio-colon">:</div>
                <div class="bio-value">danish02aljumri@gmail.com</div>
            </div>
        </div>

        <!-- Bagian Keahlian (2 Kotak Berjajar) -->
        <div class="section-box">
            <div class="section-title">✨ Keahlian</div>
            <div class="item-grid">
                <div class="interactive-card" onclick="void(0)">💻 Coding</div>
                <div class="interactive-card" onclick="void(0)">📖 Tahfidz</div>
            </div>
        </div>

        <!-- Bagian Hobi (3 Kotak dalam susunan Grid yang rapi) -->
        <div class="section-box">
            <div class="section-title">🎯 Hobi</div>
            <div class="item-grid">
                <div class="interactive-card" onclick="void(0)">📚 Baca Buku</div>
                <div class="interactive-card" onclick="void(0)">🚴 Bersepeda</div>
                <!-- Kotak ketiga otomatis menyesuaikan tata letak grid -->
                <div class="interactive-card" onclick="void(0)" style="grid-column: span 2;">♟️ Main Catur</div>
            </div>
        </div>

        <!-- Tombol Sosial Media -->
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="instagram-btn">
            Hubungi Saya di Instagram
        </a>
    </div>

</body>
</html>
